<!doctype html>
<html>
  <head>
    <title>Calendar Table</title>
  </head>
  <body>
    <table border="1" cellspacing="0" cellpadding="10">
    

      <tr>
        <th>Sun</th>
        <th>Mon</th>
        <th>Tue</th>
        <th>Wed</th>
        <th>Thu</th>
        <th colspan="2">Fri</th>
      </tr>

      <tr>i
        <td>1</td>
        <td colspan="2">2</td>
        <td>3</td>
        <td>4</td>
        <td>5</td>
        <td>6</td>
      </tr>

      <tr>
        <td rowspan="3">7</td>
        <td>8</td>
        <td>11</td>
        <td>14</td>
        <td>17</td>
        <td rowspan="2">20</td>
        <td>21</td>
      </tr>

      <tr>
        <td>9</td>
        <td>12</td>
        <td>15</td>
        <td>18</td>
        <td rowspan="2">22</td>
      </tr>

      <tr>
        <td>10</td>
        <td>13</td>
        <td>16</td>
        <td>19</td>
        <td>23</td>
      </tr>

      <colgroup>
        <col span="1" />
        <col span="4" style="background-color: yellow" />
        <col span="2" style="background-color: lightblue" />
      </colgroup>
    </table>
  </body>
</html>
